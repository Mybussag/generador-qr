<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
}

.contenedor{
    width:420px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#084dbb;
}

#qrcode{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

#resultado{
    margin-top:20px;
    word-wrap:break-word;
    font-size:13px;
}

</style>

</head>
<body>

<div class="contenedor">

<h2>Registro</h2>

<input id="ubicacion" placeholder="Ubicación">

<input id="nombre" placeholder="Nombre">

<input id="telefono" placeholder="Número Telefónico" type="tel">

<input id="destino" placeholder="Destino">

<input id="fecha" type="date">

<button onclick="guardar()">Guardar</button>

<div id="qrcode"></div>

<div id="resultado"></div>

<button id="compartir" onclick="compartirQR()" style="display:none;">
Compartir QR
</button>

</div>

<script>

function guardar(){

document.getElementById("qrcode").innerHTML="";

const datos={

id: Date.now(),

ubicacion:document.getElementById("ubicacion").value,

nombre:document.getElementById("nombre").value,

telefono:document.getElementById("telefono").value,

destino:document.getElementById("destino").value,

fecha:document.getElementById("fecha").value

};

const texto=JSON.stringify(datos);

console.log(texto);

new QRCode(document.getElementById("qrcode"),{
    text:texto,
    width:250,
    height:250,
    correctLevel: QRCode.CorrectLevel.M
});

document.getElementById("resultado").innerHTML=
"<b>Contenido del QR:</b><br><br>"+texto;

document.getElementById("compartir").style.display="block";

}
async function compartirQR(){

const qr=document.querySelector("#qrcode canvas");

if(!qr){
    alert("Primero genera un QR");
    return;
}

const imagenBlob = await new Promise(resolve => 
    qr.toBlob(resolve, "image/png")
);

const imagen=new File(
    [imagenBlob],
    "codigo-qr.png",
    {
        type:"image/png"
    }
);

if(navigator.share){

    await navigator.share({

        title:"Código QR generado",

        text:"Te comparto este código QR",

        files:[imagen]

    });

}else{

    alert("Tu dispositivo no permite compartir archivos directamente");

}

}
</script>

</body>
</html>
