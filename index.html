<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    font-family: Arial;
    background: white;
    color: white;

}

.contenedor{
    width:420px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    justify-content:center;
    display:flex;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#084dbb;
}

#mapa{
    height:300px;
    margin-top:20px;
    border-radius:10px;
}

#qrcode{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

#resultado{
    margin-top:20px;
    word-wrap:break-word;
    font-size:13px;
}

</style>

</head>
<body>

<div class="contenedor">

<h2>Registro</h2>

<input id="ubicacion" placeholder="Ubicación">

<input id="nombre" placeholder="Nombre">

<input id="telefono" placeholder="Número Telefónico" type="tel">

<input id="destino" placeholder="Destino">

<input id="fecha" type="date">

<button onclick="guardar()">Guardar</button>

<div id="mapa"></div>

<div id="qrcode"></div>

<div id="resultado"></div>

<button id="compartir" onclick="compartirQR()" style="display:none;">
Compartir QR
</button>

</div>

<script>

let mapa;
let marcador;
let latitud = null;
let longitud = null;

navigator.geolocation.watchPosition(

function(pos){

    latitud = pos.coords.latitude;
    longitud = pos.coords.longitude;

    if(!mapa){

        mapa = L.map('mapa').setView([latitud,longitud],16);

        L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:'© OpenStreetMap'
            }
        ).addTo(mapa);

        marcador = L.marker([latitud,longitud])
        .addTo(mapa)
        .bindPopup("Ubicación actual")
        .openPopup();

    }else{

        marcador.setLatLng([latitud,longitud]);

    }

},

function(error){

    console.log("Error GPS:",error);

},

{
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:10000
}

);

function guardar(){
    
    if(latitud === null || longitud === null){

    alert("Esperando obtener ubicación GPS");

    return;

}

    document.getElementById("qrcode").innerHTML="";

const datos={

id: Date.now(),

ubicacion: document.getElementById("ubicacion").value,

nombre: document.getElementById("nombre").value,

telefono: document.getElementById("telefono").value,

destino: document.getElementById("destino").value,

fecha: document.getElementById("fecha").value,

latitud: latitud,

longitud: longitud,

googleMaps: `https://www.google.com/maps?q=${latitud},${longitud}`

};

const texto=JSON.stringify(datos);

console.log(texto);

new QRCode(document.getElementById("qrcode"),{
    text:texto,
    width:250,
    height:250,
    correctLevel: QRCode.CorrectLevel.M
});

document.getElementById("resultado").innerHTML=
"<b>Contenido del QR:</b><br><br>"+texto;

document.getElementById("compartir").style.display="block";

}
async function compartirQR(){

const qr=document.querySelector("#qrcode canvas");

if(!qr){
    alert("Primero genera un QR");
    return;
}

const imagenBlob = await new Promise(resolve => 
    qr.toBlob(resolve, "image/png")
);

const imagen=new File(
    [imagenBlob],
    "codigo-qr.png",
    {
        type:"image/png"
    }
);

if(navigator.share){

    await navigator.share({

        title:"Código QR generado",

        text:"Te comparto este código QR",

        files:[imagen]

    });

}else{

    alert("Tu dispositivo no permite compartir archivos directamente");

}

}
</script>

</body>
</html>
